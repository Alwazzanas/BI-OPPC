<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاريع BI‑OPPC</title>

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.8;
            padding-top: 140px;
        }

        /* الشعار */
        .logo img {
            width: 120px;
            margin-bottom: 10px;
        }

        /* الـ Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #333;
            z-index: 999;
        }

        nav a {
            color: #d4af37;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
        }

        /* الأقسام */
        section {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 30px;
            text-align: center;
        }

        /* شبكة المشاريع */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .project-box {
            background: #111;
            padding: 25px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            transition: 0.3s;
        }

        .project-box:hover {
            background: #1a1a1a;
            transform: translateY(-5px);
        }

        .project-icon {
            font-size: 45px;
            color: #d4af37;
            margin-bottom: 15px;
            text-align: center;
        }

        .project-title {
            font-size: 22px;
            color: #d4af37;
            margin-bottom: 10px;
            text-align: center;
        }

        .project-desc {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .project-result {
            font-size: 15px;
            color: #d4af37;
            font-weight: bold;
        }
