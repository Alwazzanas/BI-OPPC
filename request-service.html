        }

        /* الشعار */
        .logo img {

            margin-bottom: 10px;

        /* الـ Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #000;

            border-bottom: 1px solid #333;

        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-size: 18px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        button {
            background: #d4af37;
            color: #000;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background: #e6c45c;
        }

        /* زر واتساب */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25D366;
            color: white;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 18px;
            text-decoration: none;
        }
