<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نبذة عن BI‑OPPC</title>

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.8;
            padding-top: 140px;
        }

        /* الشعار */
        .logo img {
            width: 120px;
            margin-bottom: 10px;
        }

        /* الـ Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #000;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #333;
            z-index: 999;
        }

        nav a {
            color: #d4af37;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
        }

        /* الأقسام */
        section {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 30px;
            text-align: center;
        }

        .box {
            background: #111;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #d4af37;
            margin-bottom: 25px;
        }

        /* قائمة القيم */
        ul {
            padding: 0;
            list-style: none;
        }

        ul li {
            background: #1a1a1a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-right: 4px solid #d4af37;
        }

        /* زر واتساب */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25D366;
            color: white;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 18px;
            text-decoration: none;
        }

        /* الفوتر */
        footer {
            background: #000;
            color: #d4af37;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #333;
        }
    </style>
